$kind: http-request
url: http://{{CaseDevServerURL}}/rest/case-execution?caseInstanceId={{caseId}}
method: GET
headers:
  Content-Type: application/json
queryParams:
  caseInstanceId: "{{caseId}}"
body:
  type: text
  content: |-
    {
       "variables":{
          "claimNumber":{
             "type":"String",
             "value":"5ba52c1af9ebcd6bcf2649a9"
          }, 
          "claimUserEmail":{
          	"type":"String",
             "value":"jcarvallo@deloitte.com"
          }
       }
    }
auth:
  type: basic
  credentials:
    username: admin
    password: admindev
scripts:
  - type: afterResponse
    code: |+
      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
          console.log("status 200 successful");
      });

      var data = JSON.parse(responseBody);

      pm.environment.set('processId',data.id);

    language: text/javascript
order: 3000
