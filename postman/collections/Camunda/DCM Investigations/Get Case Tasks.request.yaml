$kind: http-request
url: http://{{CaseDevServerURL}}/rest/task?caseInstanceId={{caseId}}
method: GET
queryParams:
  caseInstanceId: "{{caseId}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
          console.log("status 200 successful");
      });

      var data = JSON.parse(responseBody);

      pm.environment.set('taskId',data[0].id);
    language: text/javascript
settings: {}
order: 7000
