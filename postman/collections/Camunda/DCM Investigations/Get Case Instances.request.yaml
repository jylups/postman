$kind: http-request
url: http://{{CaseDevServerURL}}/rest/case-instance
method: GET
headers:
  Content-Type: application/json
auth:
  type: basic
  credentials:
    username: admin
    password: admindev
scripts:
  - type: afterResponse
    code: |+
      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
          console.log("status 200 successful");
      });

      var data = JSON.parse(responseBody);

      pm.environment.set('caseId',data[0].id);

    language: text/javascript
order: 2000
