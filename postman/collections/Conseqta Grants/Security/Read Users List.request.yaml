$kind: http-request
url: http://localhost:8083/grants-uaas-client/api/idp/users
method: POST
body:
  type: json
  content: |-
    {
      "pageNum": 0,
      "pageSize": 10,
      "freeTextSearch": "grantcreate"
    }
scripts:
  - type: afterResponse
    code: |-
      var data = JSON.parse(responseBody);

      tests["There should be a user"] = data.userDetailsList;
      tests["User name should exist"] = data.userDetailsList[0].subject;

      userData = JSON.stringify(data.userDetailsList[0]);
      pm.environment.set('testUser',userData);
      pm.environment.set('testUserSubject',data.userDetailsList[0].subject);
    language: text/javascript
settings: {}
order: 3000
