$kind: http-request
url: http://localhost:8083/grants-uaas-client/api/idp/user/{{testUserSubject}}
method: GET
scripts:
  - type: afterResponse
    code: |-
      var data = JSON.parse(responseBody);

      tests["User subject should exist"] = data.subject;


      pm.environment.set('testUserSubject',data.subject);
      pm.environment.set('testUserEmail',data.email);
      pm.environment.set('testUserfamilyName',data.familyName);
      pm.environment.set('testUsergivenName',data.givenName);
    language: text/javascript
settings: {}
order: 4000
