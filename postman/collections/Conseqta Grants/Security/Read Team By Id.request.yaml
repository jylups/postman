$kind: http-request
url: http://localhost:8083/grants-uaas-client/api/team/get/all/teams
method: POST
body:
  type: json
  content: |-
    {
      "andOperators": {
        "_id": "{{teamId}}"
      },
      "direction": "ASC",
      "pageNum": 0,
      "pageSize": 10
    }
scripts:
  - type: afterResponse
    code: |-
      var data = JSON.parse(responseBody);


      tests["There should be a team name"] = data.teams[0].teamName;
      tests["User Id should exist"] = data.teams[0].id;

      pm.environment.set('testTeam',data.teams[0]);
    language: text/javascript
settings: {}
order: 2000
