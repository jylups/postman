$kind: http-request
url: http://localhost:8083/grants-uaas-client/api/team/save/team
method: POST
body:
  type: json
  content: |
    {
      "teamName": "USDA SNAP Grants Team"
    }
scripts:
  - type: afterResponse
    code: |
      var data = JSON.parse(responseBody);

      tests["There should be a team name"] = data.teamName;
      tests["User Id should exist"] = data.id;

      pm.environment.set('teamId',data.id);
    language: text/javascript
settings: {}
order: 1000
