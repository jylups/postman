    {
        "subject": "{{testUserSubject}}",
        "email": "{{testUserEmail}}",
        "familyName": "{{testUserfamilyName}}",
        "givenName": "{{testUsergivenName}}",
        "emailVerified": true,
        "picture": null,
        "preferredUsername": "{{testUserEmail}}",
        "teams": [{
                "id": "{{teamId}}"
            }]
    }
settings: {}
order: 5000
