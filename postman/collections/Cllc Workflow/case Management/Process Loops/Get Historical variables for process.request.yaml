$kind: http-request
url: "{{server_base}}/process-api/query/historic-process-instances"
method: POST
body:
  type: json
  content: |+
    {
      "processInstanceId":"{{candidate_process_id}}",
      "start": 0,
      "size": 10
    }


scripts:
  - type: afterResponse
    code: |-
      pm.test("Success", function(){
          pm.response.to.have.status(200);
      }
      );

       pm.test("Take the last task ID from the list",function(){
           const responseJson = pm.response.json();
           pm.expect(responseJson.data.length).to.greaterThan(0);
           pm.environment.set('task_id', responseJson.data[responseJson.data.length -1].id);
           
       });
    language: text/javascript
settings: {}
order: 5000
