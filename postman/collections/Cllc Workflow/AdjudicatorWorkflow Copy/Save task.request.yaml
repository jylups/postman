$kind: http-request
url: "{{server_base}}/process-api/runtime/tasks/{{task_id}}"
method: PUT
body:
  type: json
  content: |-
    {
        "variables": [
            {
                "name": "taskOutcome",
                "value": "accept"
            }
        ]
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Success", function(){
          pm.response.to.have.status(200);
      }
      );
    language: text/javascript
settings: {}
order: 15000
