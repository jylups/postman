$kind: http-request
url: "{{server_base}}/dmn-api/dmn-repository/decision-tables?latest=true"
method: GET
queryParams:
  latest: "true"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Success", function(){
          pm.response.to.have.status(200);
      }
      );

       pm.test("Take the last task ID from the list",function(){
           const responseJson = pm.response.json();
           pm.expect(responseJson.data.length).to.greaterThan(0);
           pm.environment.set('dmn_definition_id', responseJson.data[responseJson.data.length -1].id);
       });
    language: text/javascript
settings: {}
order: 1000
