$kind: http-request
url: "{{comm-manager-server}}/communication/cases/{{case_instance_id}}/forum/posts/{{post_id}}/replies"
method: GET
body:
  type: json
  content: |-
    {
      "content": "This is another reply"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Success", function(){
          pm.response.to.have.status(200);
      }
      );
      const responseArray = pm.response.json();
      const firstItem = responseArray[0];

      pm.test("First item exists and is an object", () => {
              pm.expect(firstItem).to.be.an('object'); // Or whatever type you expect
              pm.environment.set('reply_id',firstItem.id);
      });
    language: text/javascript
settings: {}
order: 5000
