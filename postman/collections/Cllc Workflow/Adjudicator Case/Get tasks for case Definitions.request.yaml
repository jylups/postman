$kind: http-request
url: "{{server_base}}/cmmn/case-definitions/{{case_definition_id}}/tasks"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Success", function(){
          pm.response.to.have.status(200);
      }
      );

       pm.test("Take the last task ID from the list",function(){
           const responseJson = pm.response.json();
           pm.expect(responseJson.data.length).to.greaterThan(0);
           pm.environment.set('case_definition_key', responseJson.data[responseJson.data.length -1].key);
           pm.environment.set('case_diagram_location', responseJson.data[responseJson.data.length -1].diagramResource);
            pm.environment.set('case_definition_id', responseJson.data[responseJson.data.length -1].id);

       });
    language: text/javascript
settings: {}
order: 2000
