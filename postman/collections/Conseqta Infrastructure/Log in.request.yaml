$kind: http-request
url: https://harbor.conseqta.io/service/token?account=jcarvallo&scope=repository%3Aconseqta-registry%2Fconseqta-tap%3Apull&service=harbor-registry
method: GET
queryParams:
  account: jcarvallo
  scope: repository%3Aconseqta-registry%2Fconseqta-tap%3Apull
  service: harbor-registry
scripts:
  - type: afterResponse
    code: |-
      var data = JSON.parse(responseBody);

      tests["There should be a valid id token after authentication"] = data.token;

      pm.environment.set('token',data.id_token);
    language: text/javascript
settings: {}
order: 2000
