$kind: http-request
url: "{{keycloakServer}}/auth/realms/ConseqtaInternal/protocol/openid-connect/token"
method: POST
headers:
  Content-Type: application/x-www-form-urlencoded
body:
  type: urlencoded
  content:
    client_id: development-client
    username: tman
    password: password123
    grant_type: password
    client_secret: b901099f-131f-43c2-9322-843482efb91f
    scope: openid profile email offline_access
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |
      var data = JSON.parse(responseBody);

      tests["There should be a valid id token after authentication"] = data.access_token;

      pm.environment.set('access_token',data.access_token);
      pm.environment.set('refresh_token',data.refresh_token);
    language: text/javascript
settings: {}
order: 1000
