$kind: http-request
url: "{{ImagingService}}/imaging/api/content/retrive/documents"
method: GET
scripts:
  - type: afterResponse
    code: |+
      var data = JSON.parse(responseBody);

      tests["There should be at least one document to continue the service test"] = data[0].fileId;

      pm.environment.set('fileId',data[0].fileId);

    language: text/javascript
settings: {}
order: 4000
