$kind: http-request
url: "{{portal_base}}/api/Workflow/process-api/runtime/tasks/{{task_id}}"
method: POST
body:
  type: json
  content: |-
    {
        "action": "complete",
        "variables": [
            {
                "name": "taskOutcome",
                "value": "accept"
            }
            ,
            {
                "name": "isVerified",
                "value": true
            }
        ]
    }
settings: {}
order: 4000
