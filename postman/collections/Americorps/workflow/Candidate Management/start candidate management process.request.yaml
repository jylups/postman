$kind: http-request
url: http://localhost:8083/workflow-service/process-api/runtime/process-instances
method: POST
body:
  type: json
  content: |-
    {
        "processDefinitionKey": "candidateManagement",
        "variables": [
        {
          "name": "initiator",
          "value": "{{user_id}}"
        },
        {
            "name": "listingDbId",
            "value": "73"
        },
        {
            "name" : "programCode",
            "value": "vista"
        }
      ]
    }
scripts:
  - type: afterResponse
    code: |+
      pm.test("Success", function(){
          pm.response.to.have.status(200);
      }
      );

      pm.test("Process data exepected",function(){
          const responseJson = pm.response.json();
          pm.expect(responseJson.id).to.be.a('string');
          pm.environment.set('candidate_process_id', responseJson.id);
      });


    language: text/javascript
settings: {}
order: 1000
