$kind: http-request
url: https://famc-workflow-service.azurewebsites.net/workflow-service/process-api/query/tasks
method: POST
body:
  type: json
  content: |-
    {
      "start": 0,
      "size": 200
    }
scripts:
  - type: afterResponse
    code: |+
      pm.test("Success", function(){
              pm.response.to.have.status(200);
              const responseJson = pm.response.json();
              var workflowIDList = [];
              responseJson.data.forEach(payload => {
                  console.log(payload.processInstanceId);
                  workflowIDList.push('\n "' + payload.processInstanceId + '"')
              });

              pm.environment.set('all_workflow_id',workflowIDList);
          }
      );

    language: text/javascript
settings: {}
order: 5000
