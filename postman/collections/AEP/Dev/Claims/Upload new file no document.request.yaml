$kind: http-request
description: Upload Generic File
url: http://{{DevServerURL}}/damage/upload/{{damageId}}
method: POST
body:
  type: formdata
  content:
    - type: file
      key: file
      src: ""
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
          console.log("status 200 successful");
      });
    language: text/javascript
order: 4000
