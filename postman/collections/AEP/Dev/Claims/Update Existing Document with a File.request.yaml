$kind: http-request
description: Update a document with a Generic File
url: http://{{DevServerURL}}/document/upload/{{documentId}}
method: PUT
body:
  type: formdata
  content:
    - type: file
      key: file
      src: ""
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
          console.log("status 200 successful");
      });
    language: text/javascript
order: 5000
