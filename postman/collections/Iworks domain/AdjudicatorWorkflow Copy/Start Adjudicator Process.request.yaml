$kind: http-request
url: "{{server_base}}/process-api/runtime/process-instances"
method: POST
body:
  type: json
  content: |-
    {
        "processDefinitionKey": "requestSupplementalInformation",
        "variables": [
        {
          "name": "initiator",
          "value": "{{user_id}}"
        },
        {
            "name": "firstName",
            "value": "Jorge"
        },
        {
            "name": "lastName",
            "value": "Carvallo"
        },
        {
            "name": "programCode",
            "value": "vista"
        },
        {
            "name": "middleInitial",
            "value": "A"
        },
        {
            "name": "email",
            "value": "jc@cllc.io"
        },
        {
            "name": "phone",
            "value": "1234567890"
        }
      ]
    }
scripts:
  - type: afterResponse
    code: |+
      pm.test("Success", function(){
          pm.response.to.have.status(200);
      }
      );

      pm.test("Process data exepected",function(){
          const responseJson = pm.response.json();
          pm.expect(responseJson.id).to.be.a('string');
          pm.environment.set('candidate_process_id', responseJson.id);
          pm.environment.set('processDefinitionId',responseJson.processDefinitionId);
      });


    language: text/javascript
settings: {}
order: 1000
