$kind: http-request
url: "{{server_base}}/cmmn-api/cmmn-runtime/plan-item-instances?caseInstanceId={{case_instance_id}}&state=active&planItemDefinitionType=processtask"
method: GET
queryParams:
  caseInstanceId: "{{case_instance_id}}"
  state: active
  planItemDefinitionType: processtask
scripts:
  - type: afterResponse
    code: |-
      pm.test("Success", function(){
          pm.response.to.have.status(200);
      }
      );

       pm.test("Take the last task ID from the list",function(){
           const responseJson = pm.response.json();
           pm.expect(responseJson.data.length).to.greaterThan(0);
           pm.environment.set('process_plan_item_id', responseJson.data[responseJson.data.length -1].id);
           
       });
    language: text/javascript
settings: {}
order: 8000
